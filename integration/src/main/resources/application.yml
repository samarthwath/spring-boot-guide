spring:
  application:
    name: integration
  cache:
    redis:
      time-to-live: 300000

  redis:
    host: localhost
    port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      groups: abc

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 5
        permittedNumberOfCallsInHalfOpenState: 4
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

    instances:
      weatherapi:
        baseConfig: default
  retry:
    instances:
      weatherapiretry:
        max-attempts: 5
        wait-duration: 5s
    metrics:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    circuitbreakers:
      enabled: true

server:
  port: 8080

