spring.application.name=openai
spring.ai.openai.apiKey=${OPENAI_API_KEY}
#spring.ai.model.chat=ollama
#spring.ai.ollama.chat.model=llama3.2
spring.ai.chat.client.enabled=false
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

spring.datasource.url=jdbc:mysql://localhost:3306/chat_memory_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update


spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=mysql

spring.docker.compose.stop.command=stop


spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=eazy


